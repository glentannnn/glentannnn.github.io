<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habit Grid preview</title>
<style>
:root{--bg:#ecece8;--fg:#151515;--muted:#66665f;--soft:#d6d6cf;--accent:#1f3fd1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1d1a;--fg:#ededea;--muted:#a3a39b;--soft:#34352f;--accent:#8ea0ff;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1c1d1a;--fg:#ededea;--muted:#a3a39b;--soft:#34352f;--accent:#8ea0ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:15px/1.5 "Inter Tight",system-ui,sans-serif;display:grid;gap:16px;align-content:start}
label{display:grid;gap:6px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.cap{font:12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
</style>
<style>
.days,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:340px}
.days span{font:11px "IBM Plex Mono",monospace;color:var(--muted);text-align:center}
.grid button{aspect-ratio:1;border:0;background:var(--soft);cursor:pointer;padding:0}
.grid button.on{background:var(--accent)}
.grid button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style></head>
<body>
<div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
<div class="grid" id="grid"></div>
<div class="cap" id="cap"></div>
<script>
const done=new Set([0,1,3,4,7,8,9,12,15,16]),grid=document.getElementById("grid"),cap=document.getElementById("cap");
function count(){cap.textContent=grid.querySelectorAll(".on").length+" of 28 days done";}
for(let i=0;i<28;i++){
  const b=document.createElement("button");
  b.setAttribute("aria-label","Day "+(i+1));
  b.setAttribute("aria-pressed",done.has(i));
  if(done.has(i))b.classList.add("on");
  b.onclick=()=>{b.classList.toggle("on");b.setAttribute("aria-pressed",b.classList.contains("on"));count();};
  grid.appendChild(b);
}
count();
</script></body></html>
